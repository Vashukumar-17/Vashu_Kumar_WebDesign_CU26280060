<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q19</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      max-width: 720px;
      margin: 30px auto;
      padding: 0 15px;
      line-height: 1.5
    }

    input,
    textarea,
    button,
    select {
      padding: 7px 10px;
      margin: 4px 2px;
      font-size: 1rem
    }

    button {
      cursor: pointer
    }

    .out {
      margin-top: 12px;
      padding: 10px 14px;
      background: #f1f3f5;
      border-radius: 6px;
      min-height: 24px;
      white-space: pre-wrap
    }

    .ok {
      color: #0a7a2f
    }

    .bad {
      color: #c0392b
    }
  </style>
</head>

<body>
  <div class="out" id="out" style="font-size:1.2rem">Press a key...</div>
  <h4>Event log</h4>
  <div class="out" id="log" style="max-height:220px;overflow:auto;font-family:monospace;font-size:.9rem"></div>
  <script>
    const out = document.getElementById("out");
    const log = document.getElementById("log");

    function describe(e, type) {
      const character = e.key.length === 1 ? e.key : "(special key)";
      return `${type}\nKey       : ${e.key}\nCharacter : ${character}\nCode      : ${e.code}\nKey code  : ${e.keyCode}`;
    }
    function addLog(e, type) {
      log.textContent = `${type.padEnd(8)} key="${e.key}" code=${e.code} keyCode=${e.keyCode}\n` + log.textContent;
    }

    document.addEventListener("keydown", function (e) {
      out.textContent = describe(e, "KEY DOWN");
      addLog(e, "keydown");
    });
    document.addEventListener("keyup", function (e) {
      out.textContent = describe(e, "KEY UP");
      addLog(e, "keyup");
    });
  </script>
</body>

</html>
