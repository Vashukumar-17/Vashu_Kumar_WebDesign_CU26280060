<!DOCTYPE html>
<html>
<head>
<style>
  body {
    font-family: Arial;
    line-height: 1.5;
    letter-spacing: 1px;
  }

  label {
    display: block;
    font-family: Georgia;
    line-height: 1.5;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 15px;
  }

  input {
    padding: 10px;
  }

  input::placeholder {
    font-family: Arial;
    letter-spacing: 1px;
    text-transform: capitalize;
  }
</style>
</head>
<body>

<form>
  <h2>Registration</h2>

  <label>Full Name</label>
  <input type="text" placeholder="enter your name">

  <label>Email</label>
  <input type="email" placeholder="enter your email">

  <label>Course</label>
  <input type="text" placeholder="enter your course">
</form>

</body>
</html>
