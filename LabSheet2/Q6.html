<!DOCTYPE html>
<html>
<head>
<style>
  form {
    width: 600px;
    margin: 30px auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
  }

  input, textarea {
    width: 100%;
    padding: 8px;
    box-sizing: border-box;
  }

  .full {
    grid-column: 1 / 3;
  }
</style>
</head>
<body>

<form>
  <div>First Name<br><input type="text"></div>
  <div>Last Name<br><input type="text"></div>
  <div>Email<br><input type="email"></div>
  <div>Phone<br><input type="tel"></div>

  <div class="full">
    Address<br>
    <textarea rows="4"></textarea>
  </div>

  <button class="full">Submit</button>
</form>

</body>
</html>
