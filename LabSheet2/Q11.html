<!DOCTYPE html>
<html>
<head>

  <!-- External CSS would normally be written in style.css -->
  <link rel="stylesheet" href="Q11.css">

  <!-- Internal CSS -->
  <style>
    input {
      background-color: lightgray;
    }

    #email {
      background-color: lightblue;
    }
  </style>

</head>
<body>

<form>
  <h2>Contact Form</h2>

  <!-- Inline CSS -->
  <input type="text"
         style="border: 3px solid black;"
         placeholder="Name">

  <input id="email"
         type="email"
         placeholder="Email">

  <button>Send</button>
</form>

</body>
</html>
