<!DOCTYPE html>
<html>
<head>
  <title>Student Registration</title>
  <style>
    body { font-family: Arial; }
    form { width: 350px; margin: 30px auto; }
    input { width: 100%; padding: 8px; margin: 7px 0 12px; box-sizing: border-box; }
    button { padding: 8px 15px; }
  </style>
</head>
<body>
<form>
  <h2>Registration</h2>

  Name:
  <input type="text" required minlength="3" maxlength="30"
         pattern="[A-Za-z ]+">

  Email:
  <input type="email" required>

  Phone:
  <input type="text" required pattern="[0-9]{10}">

  Password:
  <input type="password" required minlength="8" maxlength="20">

  <button type="submit">Register</button>
</form>
</body>
</html>
