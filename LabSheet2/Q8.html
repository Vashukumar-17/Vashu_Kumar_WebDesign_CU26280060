<!DOCTYPE html>
<html>
<head>
<style>
  form { width: 350px; margin: 40px auto; }

  button {
    padding: 10px 20px;
    transition: 0.3s;
  }

  button:hover {
    background-color: gray;
    color: white;
  }

  button:active {
    transform: scale(0.9);
  }
</style>
</head>
<body>

<form>
  <h2>Upload File</h2>
  <input type="file" required>
  <br><br>
  <button type="submit">Upload</button>
</form>

</body>
</html>
