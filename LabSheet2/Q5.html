<!DOCTYPE html>
<html>
<head>
<style>
  body {
    font-family: Arial;
    background: #eeeeee;
  }

  .card {
    width: 300px;
    margin: 80px auto;
    padding: 25px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 5px 15px gray;
    position: relative;
  }

  .login-text {
    position: absolute;
    top: 10px;
    right: 15px;
  }

  input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    box-sizing: border-box;
  }

  button {
    width: 100%;
    padding: 10px;
  }
</style>
</head>
<body>

<div class="card">
  <span class="login-text">Login</span>
  <h2>Welcome</h2>

  <input type="email" placeholder="Email">
  <input type="password" placeholder="Password">

  <button>Sign In</button>
</div>

</body>
</html>
