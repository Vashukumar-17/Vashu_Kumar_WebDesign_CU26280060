<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q10</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      max-width: 720px;
      margin: 30px auto;
      padding: 0 15px;
      line-height: 1.5
    }

    input,
    textarea,
    button,
    select {
      padding: 7px 10px;
      margin: 4px 2px;
      font-size: 1rem
    }

    button {
      cursor: pointer
    }

    .out {
      margin-top: 12px;
      padding: 10px 14px;
      background: #f1f3f5;
      border-radius: 6px;
      min-height: 24px;
      white-space: pre-wrap
    }

    .ok {
      color: #0a7a2f
    }

    .bad {
      color: #c0392b
    }
  </style>
</head>

<body>
  <form id="form" novalidate>
    <div><label>Password:<br><input type="password" id="pw" size="28"></label></div>
    <div><label>Confirm Password:<br><input type="password" id="cpw" size="28"></label></div>
    <div id="msg" style="min-height:24px;margin:8px 0"></div>
    <button type="submit">Submit</button>
  </form>
  <div class="out" id="out"></div>
  <script>
    const pw = document.getElementById("pw");
    const cpw = document.getElementById("cpw");
    const msg = document.getElementById("msg");


    function validate() {
      if (pw.value.length < 6) return "Password must be at least 6 characters.";
      if (cpw.value === "") return "Please confirm the password.";
      if (pw.value !== cpw.value) return "Passwords do not match.";
      return "";
    }

    function live() {
      const err = validate();
      if (err) { msg.innerHTML = ""; const s = document.createElement("span"); s.className = "bad"; s.textContent = "✘ " + err; msg.appendChild(s); }
      else { msg.innerHTML = '<span class="ok">✔ Passwords match.</span>'; }
    }
    pw.addEventListener("input", live);
    cpw.addEventListener("input", live);

    document.getElementById("form").addEventListener("submit", function (e) {
      e.preventDefault();                              
      const err = validate();
      document.getElementById("out").textContent = err ? "Cannot submit: " + err : "Form submitted successfully!";
      live();
    });
  </script>
</body>

</html>
